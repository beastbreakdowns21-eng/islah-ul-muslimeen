<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002FA7" />
      <stop offset="100%" stop-color="#12247A" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#blueGrad)" />
  <!-- Islamic 8-point geometric star -->
  <g transform="translate(32, 32) scale(0.72)">
    <rect x="-18" y="-18" width="36" height="36" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.2" opacity="0.9" />
    <rect x="-18" y="-18" width="36" height="36" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2.2" transform="rotate(45)" opacity="0.9" />
    <circle cx="0" cy="0" r="13" fill="#FFFFFF" fill-opacity="0.15" />
    <!-- Calligraphic monogram (Alif Lam Saad) -->
    <path d="M-2 -8 L-2 8 M-2 2 C1 2 4 4 4 7 C4 9 2 9 0 9 C-3 9 -5 7 -5 4" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <circle cx="3" cy="-4" r="1.4" fill="#FFFFFF" />
  </g>
</svg>
