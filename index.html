    <!-- Early Runtime Polyfills for Cross-Browser Compatibility (Chrome, Safari, Firefox, pdfjs-dist) -->
    <script>
      (function() {
        try {
          var p = (window.location && window.location.pathname) ? window.location.pathname.toLowerCase() : '';
          var slugs = [
            'bedar-morai',
            'nasiruddin-shah',
            'jan-muhammad-solangi',
            'muhammad-hussain-shaikh',
            'haji-khair-muhammad-abbasi',
            'jamil-asghar-tahiri',
            'noor-hussain-bakhshi'
          ];
          var isBio = false;
          for (var i = 0; i < slugs.length; i++) {
            if (p.indexOf(slugs[i]) !== -1) {
              isBio = true;
              break;
            }
          }
          if (isBio) {
            var explicit = sessionStorage.getItem('islah_explicit_lang');
            if (explicit === 'en') {
              document.documentElement.lang = 'en';
              document.documentElement.dir = 'ltr';
            } else {
              document.documentElement.lang = 'ur';
              document.documentElement.dir = 'rtl';
            }
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function() {
        // 0. Make window.fetch writable to prevent "Cannot set property fetch of #<Window> which has only a getter"
        try {
          if (typeof window !== 'undefined' && 'fetch' in window) {
            var curFetch = window.fetch;
            var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                       Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
            if (!desc || !desc.set) {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return curFetch;
                },
                set: function(v) {
                  curFetch = v;
                },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {}

        if (typeof Promise !== 'undefined') {
          if (typeof Promise.withResolvers !== 'function') {
            Promise.withResolvers = function() {
              var resolve, reject;
              var promise = new Promise(function(res, rej) {
                resolve = res;
                reject = rej;
              });
              return { promise: promise, resolve: resolve, reject: reject };
            };
          }
          if (typeof Promise.try !== 'function') {
            Promise.try = function(fn) {
              var args = Array.prototype.slice.call(arguments, 1);
              return new Promise(function(resolve) {
                resolve(fn.apply(null, args));
              });
            };
          }
        }
        if (typeof Map !== 'undefined') {
          if (!Map.prototype.getOrInsertComputed) {
            Map.prototype.getOrInsertComputed = function(key, callback) {
              if (this.has(key)) return this.get(key);
              var value = callback(key);
              this.set(key, value);
              return value;
            };
          }
          if (!Map.prototype.getOrInsert) {
            Map.prototype.getOrInsert = function(key, defaultValue) {
              if (this.has(key)) return this.get(key);
              this.set(key, defaultValue);
              return defaultValue;
            };
          }
        }
        if (typeof Uint8Array !== 'undefined' && !Uint8Array.prototype.toHex) {
          Uint8Array.prototype.toHex = function() {
            var hex = '';
            for (var i = 0; i < this.length; i++) {
              hex += this[i].toString(16).padStart(2, '0');
            }
            return hex;
          };
        }
      })();
    </script>
